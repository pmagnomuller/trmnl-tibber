name: TRMNL Tibber DE prices

on:
  schedule:
    # Refresh current hour / cheap window every 15 minutes.
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Push Tibber prices to TRMNL
        env:
          TIBBER_ACCESS_TOKEN: ${{ secrets.TIBBER_ACCESS_TOKEN }}
          TIBBER_HOME_ID: ${{ secrets.TIBBER_HOME_ID }}
          TRMNL_PLUGIN_UUID: ${{ secrets.TRMNL_PLUGIN_UUID }}
        run: |
          if [ -z "${TIBBER_ACCESS_TOKEN}" ]; then
            echo "TIBBER_ACCESS_TOKEN secret is not set" >&2
            exit 1
          fi
          if [ -z "${TRMNL_PLUGIN_UUID}" ]; then
            echo "TRMNL_PLUGIN_UUID secret is not set" >&2
            exit 1
          fi
          bash run.sh trmnl --push
